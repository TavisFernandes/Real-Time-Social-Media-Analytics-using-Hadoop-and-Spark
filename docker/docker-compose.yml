x-app-build: &app-build
  context: ..
  dockerfile: Dockerfile

services:
  # HDFS Namenode
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    environment:
      - CLUSTER_NAME=test
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
    networks:
      - bigdata

  # HDFS Datanode
  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
      - CLUSTER_NAME=test
    depends_on:
      - namenode
    ports:
      - "9864:9864"
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    networks:
      - bigdata

  # Hive Metastore PostgreSQL
  hive-metastore-postgresql:
    image: postgres:13
    container_name: hive-metastore-postgresql
    environment:
      - POSTGRES_USER=hive
      - POSTGRES_PASSWORD=hive
      - POSTGRES_DB=metastore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bigdata

  # Hive Metastore
  hive-metastore:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-metastore
    environment:
      - HIVE_CORE_CONF_javax_jdo_option_ConnectionURL=jdbc:postgresql://hive-metastore-postgresql/metastore
      - HIVE_CORE_CONF_javax_jdo_option_ConnectionDriverName=org.postgresql.Driver
      - HIVE_CORE_CONF_javax_jdo_option_ConnectionUserName=hive
      - HIVE_CORE_CONF_javax_jdo_option_ConnectionPassword=hive
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
    depends_on:
      - namenode
      - datanode
      - hive-metastore-postgresql
    ports:
      - "9083:9083"
    networks:
      - bigdata

  # Hive Server
  hive-server:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-server
    environment:
      - HIVE_CORE_CONF_javax_jdo_option_ConnectionURL=jdbc:postgresql://hive-metastore-postgresql/metastore
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
      - HIVE_SITE_CONF_hive_metastore_uris=thrift://hive-metastore:9083
    depends_on:
      - hive-metastore
    ports:
      - "10000:10000"
    networks:
      - bigdata

  pipeline:
    image: bluesky-analytics:local
    build: *app-build
    command: ["python", "pipeline.py"]
    environment:
      PYTHONUNBUFFERED: "1"
      HDFS_NAMENODE: http://namenode:9870
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
    depends_on:
      - namenode
      - datanode
    networks:
      - bigdata
    restart: "no"

  hive-init:
    image: bde2020/hive:2.3.2-postgresql-metastore
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        until beeline -u jdbc:hive2://hive-server:10000/default -e "SELECT 1" >/dev/null 2>&1; do sleep 5; done;
        beeline -u jdbc:hive2://hive-server:10000/default -f /opt/project/create_tables.sql
    volumes:
      - ../hive/create_tables.sql:/opt/project/create_tables.sql:ro
    depends_on:
      pipeline:
        condition: service_completed_successfully
      hive-server:
        condition: service_started
    networks:
      - bigdata
    restart: "no"

  dashboard:
    image: bluesky-analytics:local
    build: *app-build
    command:
      - streamlit
      - run
      - dashboard/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "8501:8501"
    volumes:
      - ../data:/app/data
    networks:
      - bigdata
    restart: unless-stopped

volumes:
  hadoop_namenode:
  hadoop_datanode:
  postgres_data:

networks:
  bigdata:
    driver: bridge
